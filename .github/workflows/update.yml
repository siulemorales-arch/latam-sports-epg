name: Actualizar EPG

on:
  workflow_dispatch:
  push:
    paths:
      - "scraper.py"
      - "la1_scraper.py"
      - "gato_mexico_scraper.py"
      - "sky_plus_aliases.py"
      - "manual_channels.json"
      - "requirements.txt"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: epg-update
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Generar EPG completo
        run: |
          if ! python scraper.py; then
            echo "::warning::El generador completo falló; se conserva el último EPG válido y se actualizan los canales oficiales de Movistar Plus"
          fi
      - name: Actualizar TVC y Fox Sports México desde GatoTV
        run: python gato_mexico_scraper.py
      - name: Actualizar LA 1 y Eurosport desde Movistar Plus
        run: python la1_scraper.py
      - name: Asociar Sky Sports+ 11 a 13
        run: python sky_plus_aliases.py
      - name: Validar XMLTV
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          root=ET.parse('epg.xml').getroot()
          channels=root.findall('channel'); programmes=root.findall('programme')
          assert len(channels) >= 80, f'Solo {len(channels)} canales'
          assert len(programmes) >= 1500, f'Solo {len(programmes)} programas'
          names={c.findtext('display-name') for c in channels}
          required={
              'DSPORTS','ESPN Sur','M+ LALIGA (España)','DAZN F1 (España)',
              'DAZN 2 Italia','LA 1 (España)',
              'Eurosport 1 (España)','Eurosport 2 (España)',
          }
          missing=required-names
          assert not missing, f'Faltan señales críticas: {sorted(missing)}'
          eurosport_ids={'eurosport.1.espana.latam','eurosport.2.espana.latam'}
          euro_counts={cid: sum(p.get('channel') == cid for p in programmes) for cid in eurosport_ids}
          assert all(euro_counts.values()), f'Eurosport sin programación: {euro_counts}'
          mexico_ids={
              'tvc.deportes.latam',
              'fox.sports.cono.norte.latam',
              'fox.sports.2.cono.norte.latam',
              'fox.sports.3.cono.norte.latam',
          }
          mexico={cid: [p for p in programmes if p.get('channel') == cid] for cid in mexico_ids}
          mexico_counts={cid: len(items) for cid, items in mexico.items()}
          assert all(mexico_counts.values()), f'Canales mexicanos sin programación: {mexico_counts}'
          limit=datetime.now(timezone.utc) + timedelta(hours=24)
          future={cid: max(datetime.strptime(p.get('stop'), '%Y%m%d%H%M%S %z') for p in items) for cid, items in mexico.items()}
          assert all(stop >= limit for stop in future.values()), f'Cobertura mexicana insuficiente: {future}'
          print(f'{len(channels)} canales, {len(programmes)} programas; Eurosport: {euro_counts}; México: {mexico_counts}')
          PY
      - name: Guardar XML actualizado
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add epg.xml
          git diff --cached --quiet || (git commit -m "chore: actualizar EPG" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
