name: Actualizar EPG

on:
  workflow_dispatch:
  push:
    paths:
      - "scraper.py"
      - "la1_scraper.py"
      - "gato_mexico_scraper.py"
      - "gato_mega_scraper.py"
      - "claro_premium.py"
      - "claro_lineal.py"
      - "sky_plus_aliases.py"
      - "meuguia_brasil.py"
      - "tvmap_brasil.py"
      - "globo_sp.py"
      - "manual_channels.json"
      - "manual_overlay.py"
      - "preserve_channels.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: epg-update
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Conservar copia de la guía publicada
        run: cp epg.xml epg.previous.xml
      - name: Generar EPG completo
        run: |
          if ! python scraper.py; then
            echo "::warning::El generador completo falló; se conserva el último EPG válido y se actualizan los canales oficiales de Movistar Plus"
          fi
      - name: Recuperar canales y alias existentes
        run: python preserve_channels.py
      - name: Actualizar TVC y Fox Sports México desde GatoTV
        run: python gato_mexico_scraper.py
      - name: Actualizar Mega Chile desde GatoTV
        run: python gato_mega_scraper.py
      - name: Actualizar LA 1 y Eurosport desde Movistar Plus
        run: python la1_scraper.py
      - name: Asociar Sky Sports+ 11 a 13
        run: python sky_plus_aliases.py
      - name: Agregar Claro Sports Premium México
        run: python claro_premium.py
      - name: Actualizar Claro Sports México lineal
        continue-on-error: true
        run: python claro_lineal.py
      - name: Actualizar Globo RJ, SporTV, ESPN Brasil y Premiere Clubes
        run: python meuguia_brasil.py
      - name: Actualizar GE TV y Premiere 1 a 9
        run: python tvmap_brasil.py
      - name: Actualizar Globo SP
        run: python globo_sp.py
      - name: Aplicar capturas manuales verificadas
        run: python manual_overlay.py
      - name: Validar XMLTV
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          root=ET.parse('epg.xml').getroot()
          channels=root.findall('channel'); programmes=root.findall('programme')
          assert len(channels) >= 80, f'Solo {len(channels)} canales'
          assert len(programmes) >= 1500, f'Solo {len(programmes)} programas'
          baseline={c.get('id') for c in ET.parse('epg.previous.xml').getroot().findall('channel')}
          assert baseline <= {c.get('id') for c in channels}, 'El generador perdió canales existentes'
          names={c.findtext('display-name') for c in channels}
          required={
              'DSPORTS','ESPN Sur','M+ LALIGA (España)','DAZN F1 (España)',
              'DAZN 2 Italia','LA 1 (España)',
              'Eurosport 1 (España)','Eurosport 2 (España)',
          }
          missing=required-names
          assert not missing, f'Faltan señales críticas: {sorted(missing)}'
          eurosport_ids={'eurosport.1.espana.latam','eurosport.2.espana.latam'}
          euro_counts={cid: sum(p.get('channel') == cid for p in programmes) for cid in eurosport_ids}
          assert all(euro_counts.values()), f'Eurosport sin programación: {euro_counts}'
          mexico_ids={'tvc.deportes.latam','fox.sports.cono.norte.latam','fox.sports.2.cono.norte.latam','fox.sports.3.cono.norte.latam'}
          mexico={cid: [p for p in programmes if p.get('channel') == cid] for cid in mexico_ids}
          mexico_counts={cid: len(items) for cid, items in mexico.items()}
          assert all(mexico_counts.values()), f'Canales mexicanos sin programación: {mexico_counts}'
          mega_id='mega.chile.latam'
          mega_channels=[c for c in channels if c.get('id') == mega_id]
          assert len(mega_channels) == 1 and mega_channels[0].findtext('display-name') == 'Mega Chile', 'Mega Chile ausente o duplicado'
          mega=[p for p in programmes if p.get('channel') == mega_id]
          assert mega, 'Mega Chile sin programación'
          mega_until=max(datetime.strptime(p.get('stop'), '%Y%m%d%H%M%S %z') for p in mega)
          assert mega_until >= datetime.now(timezone.utc) + timedelta(hours=12), f'Mega Chile sin cobertura vigente: {mega_until}'
          claro_id='claro.sports.premium.mexico.latam'
          claro=[p for p in programmes if p.get('channel') == claro_id]
          assert len([c for c in channels if c.get('id') == claro_id]) == 1, 'Claro Sports Premium ausente o duplicado'
          assert any(p.findtext('title') == 'México vs Colombia' and p.get('start') == '20260926204500 -0400' for p in claro), 'Falta México vs Colombia en ET'
          lineal_id='claro.sports.mexico.latam'
          lineal=[p for p in programmes if p.get('channel') == lineal_id]
          assert len([c for c in channels if c.get('id') == lineal_id]) == 1 and len(lineal) >= 15, f'Claro Sports México sin guía completa: {len(lineal)}'
          lineal_until=max(datetime.strptime(p.get('stop'), '%Y%m%d%H%M%S %z') for p in lineal)
          if lineal_until < datetime.now(timezone.utc) + timedelta(hours=12):
              print(f'ADVERTENCIA: Claro Sports México desactualizado: {lineal_until}')
          getv_ids={'getv.latam','ge.tv.brasil.latam'}
          getv={cid: [p for p in programmes if p.get('channel') == cid] for cid in getv_ids}
          getv_counts={cid: len(items) for cid, items in getv.items()}
          assert all(count >= 8 for count in getv_counts.values()), f'GETV sin guía completa: {getv_counts}'
          getv_until={cid: max(datetime.strptime(p.get('stop'), '%Y%m%d%H%M%S %z') for p in items) for cid, items in getv.items()}
          assert all(stop >= datetime.now(timezone.utc) + timedelta(hours=12) for stop in getv_until.values()), f'GETV desactualizado: {getv_until}'
          telemundo_id='telemundo.deportes.ahora.usa.latam'
          telemundo=[p for p in programmes if p.get('channel') == telemundo_id]
          assert len(telemundo) >= 8, f'Telemundo Deportes Ahora sin guía completa: {len(telemundo)}'
          telemundo_until=max(datetime.strptime(p.get('stop'), '%Y%m%d%H%M%S %z') for p in telemundo)
          assert telemundo_until >= datetime.now(timezone.utc) + timedelta(hours=12), f'Telemundo Deportes Ahora desactualizado: {telemundo_until}'
          limit=datetime.now(timezone.utc) + timedelta(hours=24)
          future={cid: max(datetime.strptime(p.get('stop'), '%Y%m%d%H%M%S %z') for p in items) for cid, items in mexico.items()}
          assert all(stop >= limit for stop in future.values()), f'Cobertura mexicana insuficiente: {future}'
          brazil_ids={
              'globo.rj.brasil.latam','globo.sp.brasil.latam','ge.tv.brasil.latam',
              'sportv.1.brasil.latam','sportv.2.brasil.latam','sportv.3.brasil.latam','sportv.4.brasil.latam',
              *{f'espn.{n}.brasil.latam' for n in range(1,6)},
              *{f'premiere.{n}.brasil.latam' for n in range(1,10)},
              'premiere.clubes.brasil.latam',
          }
          ids=Counter(c.get('id') for c in channels)
          duplicates={cid: ids[cid] for cid in brazil_ids if ids[cid] != 1}
          assert not duplicates, f'Señales Brasil ausentes o duplicadas: {duplicates}'
          brazil_counts={cid: sum(p.get('channel') == cid for p in programmes) for cid in brazil_ids}
          scheduled=brazil_ids-{'sportv.4.brasil.latam'}
          empty={cid: brazil_counts[cid] for cid in scheduled if not brazil_counts[cid]}
          assert not empty, f'Señales Brasil sin programación: {empty}'
          print(f'{len(channels)} canales, {len(programmes)} programas; Eurosport: {euro_counts}; México: {mexico_counts}; Mega Chile: {len(mega)}; GETV: {getv_counts}, hasta {getv_until}; Telemundo: {len(telemundo)}, hasta {telemundo_until}; Brasil: {brazil_counts}')
          PY
      - name: Limpiar copia temporal
        run: rm epg.previous.xml
      - name: Guardar XML actualizado
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add epg.xml
          git diff --cached --quiet || (git commit -m "chore: actualizar EPG" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
