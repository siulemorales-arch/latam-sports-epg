name: Actualizar EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: epg-update
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python scraper.py
      - name: Validar XMLTV
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('epg.xml').getroot()
          channels=root.findall('channel'); programmes=root.findall('programme')
          assert channels and programmes
          print(f'{len(channels)} canales, {len(programmes)} programas')
          PY
      - name: Guardar XML actualizado
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add epg.xml
          git diff --cached --quiet || (git commit -m "chore: actualizar EPG" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
